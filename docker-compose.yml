services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: healthdocs
      POSTGRES_USER: healthdocs
      POSTGRES_PASSWORD: healthdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthdocs -d healthdocs"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    command: ["arq", "app.workers.jobs.WorkerSettings"]

  web:
    build: ./apps/web
    depends_on: [api]
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
