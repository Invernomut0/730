services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: healthdocs
      POSTGRES_USER: healthdocs
      POSTGRES_PASSWORD: healthdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./apps/api
    env_file: .env
    depends_on: [postgres, redis]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  worker:
    build: ./apps/worker
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - ./data:/data

  web:
    build: ./apps/web
    depends_on: [api]
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
