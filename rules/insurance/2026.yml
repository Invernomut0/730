version: insurance-2026-v1
status: active_reviewed
source:
  document: "Piano Sanitario 2026.pdf"
  note: "Informative manual; policy contract remains authoritative."
defaults:
  event_lookback_days: 365
  precision_first: true
  auto_confirm_threshold: 0.95
  suggest_threshold: 0.75

categories:
  hospitalization:
    annual_household_limit_eur: 300000
    coinsurance_percent: 15
    coinsurance_cap_eur: 4000
    ticket_reimbursement_percent: 100
    required_documents: [hospital_record]
    pre_hospital_days: 90
    post_hospital_days: 120

  high_diagnostics:
    annual_limit_eur: 10000
    in_network_deductible_eur: 20
    out_network_coinsurance_percent: 20
    out_network_minimum_eur: 35
    ticket_reimbursement_percent: 100
    diagnosis_required: true

  specialist_and_diagnostics:
    annual_limit_eur: 3000
    in_network_deductible_eur: 15
    out_network_coinsurance_percent: 20
    out_network_minimum_eur: 35
    ticket_reimbursement_percent: 100
    diagnosis_required: true

  physiotherapy:
    parent: specialist_and_diagnostics
    diagnosis_required: true
    prescription_required: true
    allow_multi_invoice_cycle: true
    required_documents: [prescription, diagnosis_or_clinical_indication, valid_expense_document]

  pharmaceuticals:
    parent: specialist_and_diagnostics
    diagnosis_required: true
    prescription_required: true
    receipt_product_match_required: true
    excluded_product_types:
      - otc_without_prescription
      - parapharmacy
      - medical_device
      - hygiene
      - dietary
      - supplement
      - cosmetic
    required_documents: [prescription, diagnosis_or_clinical_indication, product_level_receipt]

  dental:
    annual_limit_eur: 2600
    in_network_deductible_eur: 50
    out_network_coinsurance_percent: 25
    out_network_minimum_eur: 103
    treatment_description_required: true
    required_documents: [valid_expense_document, treatment_description]
    diagnosis_required: false

  preventive_medicine:
    diagnosis_required: false
    special_category: true

  corrective_lenses:
    diagnosis_required: false
    first_prescription_or_visual_change_required: true
    required_documents: [valid_expense_document, visual_prescription_or_change]

provenance_policy:
  require_source_page: true
  require_human_review_before_active: true
