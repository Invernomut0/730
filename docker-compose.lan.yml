services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: healthdocs
      POSTGRES_USER: healthdocs
      POSTGRES_PASSWORD: healthdocs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthdocs -d healthdocs"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    command: ["arq", "app.workers.jobs.WorkerSettings"]

  web:
    build: ./apps/web
    depends_on: [api]
    environment:
      API_INTERNAL_BASE_URL: http://api:8000

  caddy:
    image: caddy:2.8-alpine
    depends_on: [web]
    environment:
      LAN_HOSTNAME: ${LAN_HOSTNAME:-healthdocs.lan}
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config: