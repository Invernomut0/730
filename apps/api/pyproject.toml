[project]
name = "healthdocs-api"
version = "0.1.8"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
  "arq>=0.26",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "I001"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
