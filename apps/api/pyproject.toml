[project]
name = "healthdocs-api"
version = "0.1.51"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
  "pillow>=10.4",
  "pillow-heif>=0.20",
  "arq>=0.26",
  "pyyaml>=6.0",
  "pwdlib[argon2]>=0.3",
  "itsdangerous>=2.2",
  "cryptography>=43"
]

[project.scripts]
evaluate-rizzo = "app.commands.evaluate_rizzo:main"
healthdocs-backup = "app.commands.backup:backup_main"
healthdocs-verify-backup = "app.commands.backup:verify_main"
healthdocs-upload-backup = "app.commands.backup:upload_main"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "I001"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
